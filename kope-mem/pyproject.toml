[project]
name = "kope-mem"
version = "0.1.0"
description = "AscendC 算子优化记忆框架 CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=2.6.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
reme = ["reme-light>=0.5.0"]
mcp = ["modelcontextprotocol>=1.0.0"]
dev = ["pytest", "ruff"]

[project.scripts]
kope-mem = "kope_mem.cli:app"
kope-mem-mcp = "kope_mem.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kope_mem"]